<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Hub</title>
  <style>
    :root {
      --bg: #0f111a;
      --card: #1a1d2e;
      --accent: #ff4757;
      --text: #fff;
      --muted: #a0a5c1;
      --success: #2ed573;
      --warning: #ffa502;
      --info: #1e90ff;
      --border: #2a2f4c;
      --input: #0f111a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-family: sans-serif;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
    }
    .logo-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .logo-icon {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent);
    }
    .logo-text {
      font-size: 1.6rem;
      font-weight: 800;
    }
    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }
    .script-form {
      display: none;
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 2px dashed var(--accent);
    }
    .script-form.active {
      display: block;
    }
    .form-toggle-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .form-toggle-btn {
      flex: 1;
      padding: 8px;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
    }
    .btn-submit {
      background: var(--success);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .search-bar,
    .filter-select {
      width: 100%;
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 8px;
    }
    .script-card {
      background: var(--card);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .script-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .badge-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .badge {
      background: var(--border);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: .75rem;
    }
    .code-textarea {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      color: #57f287;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      height: 100px;
    }
    .card-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-copy, .btn-link {
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn-copy { background: var(--border); color: #fff; border: none; }
    .btn-link { background: #1e272e; color: #fff; }
    .btn-delete { display: none; background: #3d1e22; color: #ff4757; padding: 10px; border-radius: 8px; width: 100%; margin-top: 5px; }
    .btn-delete.admin-mode { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-box" ondblclick="checkAdmin()">
        <div class="logo-text">SCRIPT & EXECUTOR</div>
      </div>
    </header>
    <div class="main-tabs">
      <button id="tabScript" class="tab-btn active" onclick="switchMainTab('script')">📜 SCRIPT</button>
      <button id="tabExecutor" class="tab-btn" onclick="switchMainTab('executor')">⚙️ EXECUTOR</button>
    </div>
    <div id="adminForm" class="script-form">
      <div class="form-toggle-buttons">
        <button class="form-toggle-btn" onclick="setAdminFormType('script')">Thêm Script</button>
        <button class="form-toggle-btn" onclick="setAdminFormType('executor')">Thêm Exe</button>
      </div>
      <div id="formScriptFields">
        <div class="form-group"><label>Tên Game</label><input type="text" id="scriptGame"></div>
        <div class="form-group"><label>Tên Script</label><input type="text" id="scriptName"></div>
        <div class="form-group"><label>Chức năng</label><select id="scriptType"><option value="Auto Farm">Auto Farm</option><option value="Khác">Khác</option></select></div>
        <div class="form-group"><label>Loại Key</label><select id="scriptKeyType"><option value="Không Key">Không Key</option><option value="Key Mua">Key Mua</option></select></div>
        <div class="form-group"><label>Link mua Key</label><input type="text" id="scriptKeyLink"></div>
        <div class="form-group"><label>Ghi chú</label><input type="text" id="scriptNote"></div>
        <div class="form-group"><label>Mã Script</label><textarea id="scriptCode"></textarea></div>
      </div>
      <div id="formExecutorFields" style="display:none;">
        <div class="form-group"><label>Tên Executor</label><input type="text" id="exeName"></div>
        <div class="form-group"><label>Nền tảng</label><select id="exePlatform"><option value="Android">Android</option><option value="PC">PC</option></select></div>
        <div class="form-group"><label>Chi phí</label><select id="exePriceType"><option value="Free">Miễn phí</option><option value="Paid">Trả phí</option></select></div>
        <div class="form-group"><label>Link Tải/Mua</label><input type="text" id="exeLink"></div>
        <div class="form-group"><label>Ghi chú</label><input type="text" id="exeNote"></div>
      </div>
      <button class="btn-submit" onclick="handleAdminSave()">Xác Nhận Lưu</button>
    </div>
    <section id="sectionScript" class="view-section active">
      <div class="controls">
        <input type="text" id="searchScript" class="search-bar" placeholder="Tìm kiếm..." oninput="renderScripts()">
        <select id="filterGame" class="filter-select" onchange="renderScripts()"><option value="All">Tất cả Game</option></select>
      </div>
      <div id="scriptList"></div>
    </section>
    <section id="sectionExecutor" class="view-section">
      <div id="executorList"></div>
    </section>
  </div>
  <script>
    const PASS="h55032629@gmai.com";let isAdmin=false,currentAdminFormType="script";
    const defaultScripts=[{id:1,game:"Blox Fruits",name:"W-Azure Hub",type:"Auto Farm",keyType:"Không Key",keyLink:"",note:"Mượt",code:"loadstring()()"}];
    const defaultExecutors=[{id:101,name:"Delta",platform:"Android",priceType:"Free",link:"https://...",note:"Tốt"}];
    let scripts=JSON.parse(localStorage.getItem("dbScripts"))||defaultScripts;
    let executors=JSON.parse(localStorage.getItem("dbExecutors"))||defaultExecutors;
    function switchMainTab(t){
      document.getElementById("tabScript").classList.toggle("active",t==='script');
      document.getElementById("tabExecutor").classList.toggle("active",t==='executor');
      document.getElementById("sectionScript").classList.toggle("active",t==='script');
      document.getElementById("sectionExecutor").classList.toggle("active",t==='executor');
      if(t==='script')renderScripts();else renderExecutors();
    }
    function setAdminFormType(t){
      currentAdminFormType=t;
      document.getElementById("formScriptFields").style.display=t==='script'?'block':'none';
      document.getElementById("formExecutorFields").style.display=t==='executor'?'block':'none';
    }
    function checkAdmin(){
      const t=prompt("Nhập mật khẩu Admin:");
      if(t===PASS){isAdmin=true;document.getElementById("adminForm").classList.add("active");renderScripts();renderExecutors();alert("Đăng nhập Admin!")}
    }
    function updateGameFilterOptions(){
      const t=document.getElementById("filterGame");const a=t.value;const e=["All"];
      scripts.forEach(s=>{if(s.game&&!e.includes(s.game))e.push(s.game)});
      t.innerHTML="";e.forEach(g=>{const o=document.createElement("option");o.value=g;o.innerText=g;t.appendChild(o)});
      t.value=a;
    }
    function renderScripts(){
      updateGameFilterOptions();const t=document.getElementById("scriptList");t.innerHTML="";
      scripts.forEach(i=>{
        let l=i.keyType==="Key Mua"&&i.keyLink?`<a href="${i.keyLink}" target="_blank" class="btn-link">🛒 Mua Key VIP</a>`:"";
        const d=document.createElement("div");d.className="script-card";
        d.innerHTML=`<div class="script-title">${i.name}</div><div class="badge-container"><span class="badge">🎮 ${i.game}</span></div><textarea class="code-textarea" readonly>${i.code}</textarea><div class="card-buttons"><button class="btn-copy" onclick="copyScript(${i.id},this)">📋 Sao chép</button>${l}<button class="btn-delete ${isAdmin?'admin-mode':''}" onclick="deleteItem('script',${i.id})">🗑️ Xóa</button></div>`;
        t.appendChild(d);
      });
    }
    function renderExecutors(){
      const t=document.getElementById("executorList");t.innerHTML="";
      executors.forEach(i=>{
        const d=document.createElement("div");d.className="script-card";
        d.innerHTML=`<div class="script-title">${i.name}</div><div class="card-buttons"><a href="${i.link}" target="_blank" class="btn-link">🔗 Tải/Mua</a><button class="btn-delete ${isAdmin?'admin-mode':''}" onclick="deleteItem('executor',${i.id})">🗑️ Xóa</button></div>`;
        t.appendChild(d);
      });
    }
    function handleAdminSave(){
      if(!isAdmin)return;
      if(currentAdminFormType==="script"){
        const g=document.getElementById("scriptGame").value;const n=document.getElementById("scriptName").value;const cd=document.getElementById("scriptCode").value;
        scripts.unshift({id:Date.now(),game:g,name:n,type:"Auto Farm",keyType:"Không Key",keyLink:"",note:"",code:cd});
        localStorage.setItem("dbScripts",JSON.stringify(scripts));renderScripts();
      }
      alert("Đã lưu!");
    }
    function copyScript(id,btn){
      const s=scripts.find(x=>x.id===id);
      if(s&&s.code){navigator.clipboard.writeText(s.code).then(()=>{alert("Đã copy!");});}
    }
    renderScripts();
  </script>
</body>
</html>
