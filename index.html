<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Script Hub</title><style>:root{--bg:#0f111a;--card:#1a1d2e;--accent:#ff4757;--text:#ffffff;--muted:#a0a5c1;--success:#2ed573;}*{box-sizing:border-box;min-width:0;}body{font-family:sans-serif;background:var(--bg);color:var(--text);padding:10px;margin:0;width:100%;overflow-x:hidden;}.container{max-width:500px;margin:0 auto;width:100%;}header{text-align:center;margin-bottom:20px;}.logo-box{display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;}.logo-icon{font-size:1.8rem;font-weight:bold;color:var(--accent);text-shadow:0 0 8px rgba(255,71,87,.6);position:relative;}.logo-icon::after{content:"⚡";position:absolute;top:-5px;right:-8px;font-size:.9rem;}.logo-text{font-size:1.6rem;font-weight:800;letter-spacing:1px;background:linear-gradient(45deg,var(--text),var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.script-form{display:none;background:var(--card);padding:15px;border-radius:8px;margin-bottom:20px;width:100%;border:2px dashed var(--accent);}.script-form.active{display:block;}.form-group{margin-bottom:12px;width:100%;}.form-group label{display:block;margin-bottom:5px;color:var(--muted);font-size:.85rem;}.form-group input,.form-group select,.form-group textarea {width:100%;padding:10px;background:#0f111a;border:1px solid #2a2f4c;border-radius:6px;color:#fff;font-size:.9rem;}.btn-submit{background:var(--success);color:#fff;border:none;padding:12px;border-radius:6px;cursor:pointer;width:100%;font-weight:bold;}.controls{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;width:100%;}.search-bar,.filter-select{width:100%;padding:12px;background:var(--card);border:1px solid #2a2f4c;color:#fff;border-radius:6px;font-size:.9rem;height:45px;}.script-card{background:var(--card);border-radius:8px;padding:15px;margin-bottom:15px;border:1px solid #2a2f4c;width:100%;}.script-title{font-size:1.1rem;font-weight:bold;margin:0 0 8px 0;word-break:break-all;overflow-wrap:break-word;}.badge-container{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}.badge{background:#2a2f4c;color:var(--accent);padding:4px 8px;border-radius:4px;font-size:.75rem;font-weight:bold;}.badge.game{background:#10ac84;color:#fff;}.script-note{font-size:.85rem;color:var(--muted);margin-bottom:10px;word-break:break-all;}.code-textarea{width:100%;background:#0f111a;border:1px solid #2a2f4c;color:#57f287;font-family:monospace;font-size:.85rem;padding:10px;border-radius:4px;margin-bottom:12px;resize:none;height:120px;display:block;outline:none;box-sizing:border-box;}.btn-copy{background:#2a2f4c;color:#fff;border:none;padding:12px;border-radius:6px;cursor:pointer;width:100%;font-weight:bold;}.btn-delete{display:none;background:#3d1e22;color:#ff4757;border:none;padding:10px;border-radius:6px;margin-top:8px;cursor:pointer;width:100%;}.btn-delete.admin-mode{display:block;}</style></head><body><div class="container"><header><div class="logo-box" ondblclick="checkAdmin()"><div class="logo-icon">{ }</div><div class="logo-text">TỔNG HỢP SCRIPT</div></div></header><div id="adminForm" class="script-form"><h3>🛠️ THÊM SCRIPT MỚI</h3><div class="form-group"><label>Tên Game</label><input type="text" id="scriptGame" placeholder="Blox Fruits..."></div><div class="form-group"><label>Tên Bản Script</label><input type="text" id="scriptName" placeholder="W-Azure..."></div><div class="form-group"><label>Thể loại chức năng</label><select id="scriptType"><option value="Auto Farm">Auto Farm / Level</option><option value="Săn Item / Boss">Săn Item / Boss</option><option value="PVP / Săn Bounty">PVP / Săn Bounty</option><option value="Tự Động Hóa / Khác">Tự Động Hóa / Khác</option></select></div><div class="form-group"><label>Ghi chú ngắn</label><input type="text" id="scriptNote" placeholder="Không key..."></div><div class="form-group"><label>Mã Lệnh Script</label><textarea id="scriptCode" rows="3" placeholder="loadstring(...)()"></textarea></div><button class="btn-submit" onclick="addScript()">Xác Nhận Lưu</button></div><div class="controls"><input type="text" id="searchInput" class="search-bar" placeholder="🔍 Tìm kiếm..." oninput="render()"><select id="filterGame" class="filter-select" onchange="render()"><option value="All">Tất cả Game</option></select><select id="filterType" class="filter-select" onchange="render()"><option value="All">Tất cả chức năng</option><option value="Auto Farm">Auto Farm / Level</option><option value="Săn Item / Boss">Săn Item / Boss</option><option value="PVP / Săn Bounty">PVP / Săn Bounty</option><option value="Tự Động Hóa / Khác">Tự Động Hóa / Khác</option></select></div><div id="scriptList"></div></div><script>const PASS="h55032629@gmai.com";let isAdmin=!1;const defaults=[{id:1,game:"Blox Fruits",name:"W-Azure Hub",type:"Auto Farm",note:"Không key",code:"loadstring(game:HttpGet('https://luarmor.net'))()"},{id:2,game:"King Legacy",name:"Hoho Hub",type:"Săn Item / Boss",note:"Auto farm",code:"loadstring(game:HttpGet('https://github.com'))()"}];let scripts=JSON.parse(localStorage.getItem("myScripts"))||defaults;function checkAdmin(){const e=prompt("Nhập mật khẩu Admin:");e===PASS?(isAdmin=!0,document.getElementById("adminForm").classList.add("active"),render(),alert("Đăng nhập thành công!")):null!==e&&alert("Sai mật khẩu!")}function updateGameFilterOptions(){const e=document.getElementById("filterGame"),t=e.value,n=["All"];scripts.forEach(e=>{e.game&&!n.includes(e.game)&&n.push(e.game)}),e.innerHTML="",n.forEach(t=>{const n=document.createElement("option");n.value=t,n.innerText="All"===t?"Tất cả Game":t,e.appendChild(n)}),n.includes(t)&&(e.value=t)}function render(){updateGameFilterOptions();const e=document.getElementById("scriptList"),t=document.getElementById("searchInput").value.toLowerCase(),n=document.getElementById("filterGame").value,a=document.getElementById("filterType").value;e.innerHTML="";const r=scripts.filter(e=>{const r=e.name.toLowerCase().includes(t)||e.note.toLowerCase().includes(t)||e.game&&e.game.toLowerCase().includes(t),c="All"===n||e.game===n,l="All"===a||e.type===a;return r&&c&&l});if(0===r.length)return void(e.innerHTML='<p style="text-align:center;color:var(--muted);font-size:0.9rem;">Không có script phù hợp</p>');r.forEach(t=>{const n=document.createElement("div");n.className="script-card",n.innerHTML=`<div class="script-title">${t.name}</div><div class="badge-container"><span class="badge game">🎮 ${t.game||"Chưa rõ"}</span><span class="badge">${t.type}</span></div><div class="script-note">📌 Ghi chú: ${t.note||"Không có"}</div><textarea class="code-textarea" readonly>${t.code}</textarea><button class="btn-copy" onclick="copy(${t.id},this)">📋 Sao chép Script</button><button class="btn-delete ${isAdmin?"admin-mode":""}" onclick="del(${t.id})">Xóa</button>`,e.appendChild(n)})}function addScript(){if(isAdmin){const e=document.getElementById("scriptGame").value.trim(),t=document.getElementById("scriptName").value.trim(),n=document.getElementById("scriptType").value,a=document.getElementById("scriptNote").value.trim(),r=document.getElementById("scriptCode").value.trim();if(!e||!t||!r)return void alert("Vui lòng nhập đầy đủ: Tên Game, Tên Bản Script và Mã Lệnh!");scripts.unshift({id:Date.now(),game:e,name:t,type:n,note:a,code:r}),localStorage.setItem("myScripts",JSON.stringify(scripts)),document.getElementById("scriptGame").value="",document.getElementById("scriptName").value="",document.getElementById("scriptNote").value="",document.getElementById("scriptCode").value="",render(),alert("Đã thêm script game mới thành công!")}}function copy(e,t){const n=scripts.find(t=>t.id===e);n&&n.code&&navigator.clipboard.writeText(n.code).then(()=>{t.style.background="var(--success)",t.innerText="✓ Đã sao chép!",setTimeout(()=>{t.innerText="📋 Sao chép Script",t.style.background="#2a2f4c"},2000)}).catch(()=>{alert("Lỗi trình duyệt!")})}function del(e){isAdmin&&confirm("Bạn có chắc chắn muốn xóa script này không?")&&(scripts=scripts.filter(t=>t.id!==e),localStorage.setItem("myScripts",JSON.stringify(scripts)),render())}render();</script></body></html>
